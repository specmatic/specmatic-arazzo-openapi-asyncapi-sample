version: 3
systemUnderTest:
  service:
    $ref: "#/components/services/order"
    runOptions:
      $ref: "#/components/runOptions/orderTest"
    data:
      examples:
        - directories: [examples]
specmatic:
  settings:
    test:
      schemaResiliencyTests: all
      strictMode: true
  governance:
    report:
      formats: [ctrf, html]
      outputDirectory: build/reports/specmatic
    successCriteria:
      minCoveragePercentage: 100
      maxMissedOperationsInSpec: 0
      enforce: true
components:
  services:
    order:
      description: Order REST API
      definitions:
        - definition:
            source:
              filesystem:
                directory: ../../../specifications/openapi
            specs: [order.yaml]
  runOptions:
    orderTest:
      openapi:
        type: test
        baseUrl: http://order:3002
